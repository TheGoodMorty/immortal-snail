name: Publish

# Publishes to Modrinth, CurseForge and GitHub Releases.
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version-tag:
        description: "Git tag to attach the GitHub release to (e.g. v0.1.0)"
        required: false
        default: ""

# Required for creating GitHub Releases
permissions:
  contents: write

# Never run two publishes at once
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish-1-21-11:
    name: Build & publish (Minecraft 1.21.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        run: echo "MOD_VERSION=$(grep '^mod_version=' 1.21.11/gradle.properties | cut -d '=' -f2)" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build --no-daemon
        working-directory: 1.21.11

      - name: Verify jar exists
        run: test -f "1.21.11/build/libs/immortalsnail-${MOD_VERSION}.jar"

      - name: Publish to Modrinth / CurseForge / GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: PoROc13w
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: "1675952"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          github-tag: ${{ inputs.version-tag || github.ref_name }}

          # Primary file: the remapped production jar (no -sources jar)
          files-primary: 1.21.11/build/libs/immortalsnail-${{ env.MOD_VERSION }}.jar
          fail-on-unmatched-files: true

          name: Immortal Snail ${{ env.MOD_VERSION }} for Minecraft 1.21.11
          version-number: ${{ env.MOD_VERSION }}+mc1.21.11
          version-type: release
          changelog-file: 1.21.11/CHANGELOG.md

          loaders: fabric
          game-versions: 1.21.11

          dependencies: |
            fabric-api: depends
            cloth-config: depends
            jei: optional

  publish-26-2:
    name: Build & publish (Minecraft 26.2)
    needs: publish-1-21-11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        run: echo "MOD_VERSION=$(grep '^mod_version=' 26.2/gradle.properties | cut -d '=' -f2)" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build --no-daemon
        working-directory: 26.2

      - name: Verify jar exists
        run: test -f "26.2/build/libs/immortalsnail-${MOD_VERSION}.jar"

      - name: Publish to Modrinth / CurseForge / GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: PoROc13w
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: "1675952"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          github-tag: ${{ inputs.version-tag || github.ref_name }}

          # 26.x is unobfuscated: the plain jar IS the final release jar
          files-primary: 26.2/build/libs/immortalsnail-${{ env.MOD_VERSION }}.jar
          fail-on-unmatched-files: true

          name: Immortal Snail ${{ env.MOD_VERSION }} for Minecraft 26.2
          version-number: ${{ env.MOD_VERSION }}+mc26.2
          version-type: release
          changelog-file: 26.2/CHANGELOG.md

          loaders: fabric
          game-versions: 26.2

          dependencies: |
            fabric-api: depends
            cloth-config: depends
            jei: optional
