name: Publish

# Publishes every Minecraft version listed in versions.json to
# Modrinth, CurseForge and GitHub Releases.
#
# Adding a new Minecraft port? Copy an existing project folder, then add ONE
# line to versions.json - no workflow changes needed.
#
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version-tag:
        description: "Git tag to attach the GitHub release to (e.g. v0.1.0)"
        required: false
        default: ""

# Required for creating GitHub Releases
permissions:
  contents: write

# Never run two publishes at once
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  discover:
    name: Discover versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build publish matrix from versions.json
        id: versions
        run: |
          echo "matrix=$(jq -c '{include: .}' versions.json)" >> "$GITHUB_OUTPUT"

  publish:
    name: Build & publish (Minecraft ${{ matrix.mc }})
    needs: discover
    strategy:
      # One at a time: each job attaches assets to the SAME GitHub release tag
      max-parallel: 1
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        run: echo "MOD_VERSION=$(grep '^mod_version=' ${{ matrix.dir }}/gradle.properties | cut -d '=' -f2)" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build --no-daemon
        working-directory: ${{ matrix.dir }}

      - name: Verify jar exists
        run: test -f "${{ matrix.dir }}/build/libs/immortalsnail-${MOD_VERSION}.jar"

      - name: Publish to Modrinth / CurseForge / GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: PoROc13w
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: "1675952"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          github-tag: ${{ inputs.version-tag || github.ref_name }}

          # 1.21.x: Loom remaps the jar, so this IS the production jar.
          # 26.x: unobfuscated, the plain jar IS the final jar.
          files-primary: ${{ matrix.dir }}/build/libs/immortalsnail-${{ env.MOD_VERSION }}.jar
          fail-on-unmatched-files: true

          name: Immortal Snail ${{ env.MOD_VERSION }} for Minecraft ${{ matrix.mc }}
          version-number: ${{ env.MOD_VERSION }}+mc${{ matrix.mc }}
          version-type: release
          changelog-file: ${{ matrix.dir }}/CHANGELOG.md

          loaders: fabric
          game-versions: ${{ matrix.mc }}

          dependencies: |
            fabric-api: depends
            cloth-config: depends
            jei: optional
